name: Release

# Publishes the package to npm when a GitHub release is published, then attaches the packed
# .tgz to that release (offline installs, and networks where npm is unreachable).
#
# npm Trusted Publishing: npm trusts this workflow through GitHub's OIDC token, so the
# repository keeps no npm token and every version gets a provenance statement. Set it up once
# on npmjs.com: package dsh-remote-console -> Settings -> Trusted Publisher -> GitHub Actions,
# user cccodder, repository dsh-remote-console, workflow release.yml, no environment.
#
# The release tag must be v<version in package.json> and must point at a commit on main. A
# version with a pre-release part (0.7.0-rc.1) goes to the npm tag "next", so "latest" stays
# on the last stable version.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every check and pack the package, but do not publish
        type: boolean
        default: true

permissions:
  # write: attach the package file to the release.
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Check and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.6.2 --no-fund --no-audit

      - name: Check the tag and the branch
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The release tag is $TAG, but package.json has version $version. Tag v$version or change the version."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at a commit that is not on main. Release from main."
            exit 1
          fi

      - name: Install DSH peer packages
        run: >-
          npm install --no-save --no-package-lock
          @deepseek-ai/dsh-home-paths@0.2.1-rc.2
          @deepseek-ai/dsh-tools@0.2.1-rc.2
          @deepseek-ai/dsh-plugin-market-index@0.2.1-rc.2
          @deepseek-ai/schemastery@3.18.5

      - run: npm test
      - run: node scripts/check-release.mjs

      - name: Pack (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm pack --dry-run

      - name: Publish
        if: github.event_name == 'release'
        run: |
          tag="$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")"
          echo "Publishing $(node -p "require('./package.json').version") with the npm tag $tag"
          npm publish --provenance --access public --tag "$tag"

      # The release keeps the package file for installs without npm.
      - name: Attach the package to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          npm pack
          gh release upload "$TAG" "dsh-remote-console-$(node -p "require('./package.json').version").tgz" --clobber
